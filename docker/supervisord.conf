[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:postgres]
command=/usr/local/pgbin/postgres -D /var/lib/postgresql/data -c listen_addresses=localhost
user=postgres
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Both apps wait for Postgres so they don't crash-loop on the first start
[program:keycloak]
command=/bin/sh -c 'until /usr/local/pgbin/pg_isready -q -h localhost; do sleep 1; done; exec /opt/keycloak/bin/kc.sh start --optimized --import-realm'
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=/bin/sh -c 'until /usr/local/pgbin/pg_isready -q -h localhost; do sleep 1; done; exec java -Xmx384m -jar /opt/eventell/eventell.jar'
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
