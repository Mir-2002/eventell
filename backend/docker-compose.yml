services:
  db:
    image: postgres:latest
    ports:
      - "5433:5432"
    restart: always
    environment:
      POSTGRES_PASSWORD: changemeinprod!
    volumes:
      - postgres-data:/var/lib/postgresql

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8888:8080"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "9090:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "http://localhost:5173"
      KC_HOSTNAME_ADMIN: "http://localhost:9090"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
      # Eventell login theme; build it with `npm run build-keycloak-theme` in ../keycloak-theme
      - ../keycloak-theme/dist_keycloak:/opt/keycloak/providers:ro
    command:
      - start-dev
      - --db=dev-file
      - --import-realm
volumes:
  keycloak-data:
    driver: local
  postgres-data:
    driver: local
